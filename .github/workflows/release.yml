name: Publish Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish and package Windows x64 and x86
        shell: pwsh
        run: |
          foreach ($rid in @('win-x64', 'win-x86')) {
            $output = Join-Path $PWD "artifacts/release/$rid"
            dotnet publish ./TheAlarm.csproj --configuration Release --runtime $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false --output $output
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $rid" }
            $exe = Join-Path $output 'TheAlarm.exe'
            if (-not (Test-Path -LiteralPath $exe)) { throw "Missing executable: $rid" }
            # Explicit allowlist: never ship local configuration or macro data.
            Compress-Archive -LiteralPath $exe -DestinationPath "artifacts/TheAlarm-$rid.zip" -CompressionLevel Optimal -Force
          }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME ./artifacts/TheAlarm-win-x64.zip ./artifacts/TheAlarm-win-x86.zip --title "TheAlarm $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
